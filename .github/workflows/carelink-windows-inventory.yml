name: CareLink isolated binary inspection
on:
  push:
    paths:
      - '.github/workflows/carelink-windows-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Install and inspect actual installed files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force report | Out-Null
          $url = 'https://carelink.minimed.eu/tools/uploader/CareLinkUploader-ACC-7350-3.15.0-windows-installer.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'carelink-installer.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRedirection 5
          Get-FileHash $installer -Algorithm SHA256 | Out-File report/installer-hash.txt
          (Get-AuthenticodeSignature $installer | Format-List | Out-String) | Out-File report/installer-signature.txt
          $roots = @('C:\Program Files','C:\Program Files (x86)',"$env:LOCALAPPDATA\Programs","$env:APPDATA")
          $before = @(foreach ($root in $roots) { if (Test-Path $root) { Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName } })
          $beforeServices = @(Get-Service | Select-Object -ExpandProperty Name)
          $beforeDrivers = @(Get-CimInstance Win32_SystemDriver | Select-Object -ExpandProperty Name)
          $p = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            'Timed out after 180 seconds' | Out-File report/install-status.txt
          } else {
            "Exit code: $($p.ExitCode)" | Out-File report/install-status.txt
          }
          $after = @(foreach ($root in $roots) { if (Test-Path $root) { Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName } })
          $newFiles = @(Compare-Object $before $after | Where-Object SideIndicator -eq '=>' | Select-Object -ExpandProperty InputObject)
          $newFiles | Sort-Object | Out-File report/installed-files.txt
          Compare-Object $beforeServices @(Get-Service | Select-Object -ExpandProperty Name) | Out-File report/services-diff.txt
          Compare-Object $beforeDrivers @(Get-CimInstance Win32_SystemDriver | Select-Object -ExpandProperty Name) | Out-File report/drivers-diff.txt
          $newFiles | ForEach-Object {
            $f = Get-Item -LiteralPath $_ -ErrorAction SilentlyContinue
            if ($f) {
              $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256 -ErrorAction SilentlyContinue).Hash
              [pscustomobject]@{Path=$f.FullName;Bytes=$f.Length;SHA256=$hash;Product=$f.VersionInfo.ProductName;Version=$f.VersionInfo.ProductVersion;Description=$f.VersionInfo.FileDescription}
            }
          } | Export-Csv report/installed-file-analysis.csv -NoTypeInformation -Encoding utf8
          $env:CARELINK_SCAN_LIST = (Join-Path (Get-Location) 'report/installed-files.txt')
          $env:CARELINK_REPORT_DIR = (Join-Path (Get-Location) 'report')
          python -m pip -q install pefile
          @'
          import csv, os, pathlib, re, hashlib
          import pefile
          paths = pathlib.Path(os.environ['CARELINK_SCAN_LIST']).read_text(encoding='utf-16', errors='replace').splitlines()
          out = pathlib.Path(os.environ['CARELINK_REPORT_DIR'])
          rows, imports, exports, indicators = [], [], [], []
          words = re.compile(rb'(?i)(?:usb|hid|ftdi|d2xx|vcp|bluetooth|serial|medtronic|carelink)')
          for path in paths:
              p = pathlib.Path(path.strip())
              if not p.is_file(): continue
              try:
                  data = p.read_bytes()
                  rows.append([str(p),len(data),hashlib.sha256(data).hexdigest(),data[:16].hex()])
                  if p.suffix.lower() in ('.exe','.dll','.sys'):
                      try:
                          pe = pefile.PE(data=data, fast_load=True)
                          pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT'],pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_EXPORT']])
                          for group in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):
                              imports.append([str(p),group.dll.decode(errors='replace'),';'.join((x.name or b'').decode(errors='replace') for x in group.imports)[:3000]])
                          if hasattr(pe,'DIRECTORY_ENTRY_EXPORT'):
                              for item in pe.DIRECTORY_ENTRY_EXPORT.symbols[:500]:
                                  exports.append([str(p),(item.name or b'').decode(errors='replace')])
                      except Exception as e: indicators.append([str(p),'PE parse error',str(e)[:200]])
                  # Inspect bytes themselves, but export only limited, non-sensitive indicators.
                  if len(data) <= 30000000:
                      for match in list(words.finditer(data))[:60]:
                          start=max(0,match.start()-35); end=min(len(data),match.end()+65)
                          snippet=data[start:end]
                          printable=''.join(chr(b) if 32<=b<=126 else ' ' for b in snippet)
                          indicators.append([str(p),'binary match',printable[:130]])
              except Exception as e: indicators.append([str(p),'read error',str(e)[:200]])
          for name,head,content in [('binary-signatures.csv',['path','bytes','sha256','first16hex'],rows),('pe-imports.csv',['path','library','imported_functions'],imports),('pe-exports.csv',['path','exported_symbol'],exports),('binary-indicators.csv',['path','type','indicator'],indicators)]:
              with (out/name).open('w',newline='',encoding='utf-8-sig') as f:
                  w=csv.writer(f);w.writerow(head);w.writerows(content)
          (out/'scan-summary.txt').write_text(f'Files: {len(rows)}; imports: {len(imports)}; exports: {len(exports)}; indicators: {len(indicators)}\n',encoding='utf-8')
          '@ | python -
          Remove-Item $installer -Force -ErrorAction SilentlyContinue
      - name: Upload binary inspection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carelink-binary-inspection
          path: report/
          retention-days: 7
